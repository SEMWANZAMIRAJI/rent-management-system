{% extends 'base.html' %}
{% block content %}

<div class="flex justify-center mt-10">
  <div class="card w-full max-w-lg p-8 bg-white shadow-md rounded-lg text-center">

    <!-- Title -->
    <h2 class="text-2xl font-bold mb-6 text-red-600">Delete Contract</h2>

    <!-- Confirmation Text -->
    <p class="mb-6 text-gray-700 text-lg">
      Are you sure you want to delete the contract of
      <strong>{{ object.tenant.full_name }}</strong> - <strong>{{ object.house.house_number }}</strong>?
    </p>

    <!-- Form Buttons -->
    <form method="POST" class="flex flex-col md:flex-row justify-center gap-4">
      {% csrf_token %}
      
      <!-- Delete Button -->
      <button type="submit"
        class="w-full md:w-auto bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200">
        Delete
      </button>

      <!-- Cancel Button -->
      <a href="{% url 'contracts:list' %}"
        class="w-full md:w-auto bg-gray-300 hover:bg-gray-400 text-black font-semibold py-3 px-6 rounded-lg transition-all duration-200">
        Cancel
      </a>
    </form>

  </div>
</div>

{% endblock %}
