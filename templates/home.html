{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TITLE -->
    <title>Login</title>

    <!-- TAILWIND -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FONTAWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- GOOGLE FONT : JOST -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>


<body>

<!-- MAIN CONTAINER -->
<div class="w-full max-w-md p-6 mx-auto">

    <!-- ================= LOGO SECTION ================= -->
    <div class="text-center mb-8">

        <div class="inline-block p-4 rounded-2xl logo-box shadow-lg mb-4">
            <img src="{% static 'images/logo.png' %}" class="w-12" alt="Logo">
        </div>

        <h1 class="title-main font-bold text-white">
            Elshaddai
        </h1>

        <p class="text-white/80 subtitle">
            Smart Business Finance
        </p>

    </div>


    <!-- ================= LOGIN CARD ================= -->
    <div class="glass-card p-8 shadow-2xl">

        <h2 class="text-2xl text-white font-semibold mb-6 text-center">
            Welcome Back
        </h2>

        {% if messages %}
        <div id="toast-container" class="fixed top-5 right-5 z-50">
        {% for message in messages %}
            <div class="toast flex items-center gap-3 px-4 py-3 mb-3 rounded-lg shadow-lg text-white
            {% if message.tags == 'success' %} bg-green-500
            {% elif message.tags == 'error' %} bg-red-500
            {% else %} bg-blue-500 {% endif %}">
            
            <!-- Icon -->
            <i class="fa 
                {% if message.tags == 'success' %} fa-check-circle
                {% elif message.tags == 'error' %} fa-times-circle
                {% else %} fa-info-circle {% endif %}">
            </i>

            <!-- Message -->
            <span>{{ message }}</span>
            </div>
        {% endfor %}
        </div>
        {% endif %}
        <!-- LOGIN FORM -->
        <form method="POST" action="{% url 'tenants:login' %}">
            {% csrf_token %}

            <!-- USERNAME FIELD -->
            <div class="mb-5">

                <label class="text-white text-sm mb-2 block">
                    Username
                </label>

                <div class="relative">

                    <i class="fa fa-user absolute left-3 top-4 text-white"></i>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        class="input-field w-full pl-10 py-3 rounded-xl text-white placeholder-white/70">

                </div>

            </div>


            <!-- PASSWORD FIELD -->
            <div class="mb-6">

                <label class="text-white text-sm mb-2 block">
                    Password
                </label>

                <div class="relative">

                    <i class="fa fa-lock absolute left-3 top-4 text-white"></i>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="••••••••"
                        class="input-field w-full pl-10 py-3 rounded-xl text-white placeholder-white/70">

                    <button
                        type="button"
                        onclick="togglePassword()"
                        class="absolute right-3 top-3 text-white">

                        <i id="toggleIcon" class="fa fa-eye"></i>

                    </button>

                </div>

            </div>

<!-- ================= FORGOT PASSWORD LINK ================= -->
            <div class="mb-4 text-right">
                <a href="{% url 'tenants:password_reset' %}" class="text-sm text-white underline hover:text-gray-200">
                    Forgot Password?
                </a>
            </div>
            <!-- LOGIN BUTTON -->
            <button
                type="submit"
                class="login-btn w-full py-3 text-white font-bold rounded-xl shadow-lg">

                Login

            </button>

        </form>


        <!-- REGISTER LINK -->
        <div class="mt-6 text-center text-white text-sm">

            Don't have account?

            <a href="{% url 'tenants:register' %}" class="font-semibold underline">
                Register
            </a>

        </div>

    </div>

</div>


<!-- CUSTOM JS -->
<script src="{% static 'js/login.js' %}"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const toasts = document.querySelectorAll(".toast");

    toasts.forEach((toast, index) => {
        // Fade in
        toast.style.opacity = "0";
        toast.style.transform = "translateX(100%)";

        setTimeout(() => {
            toast.style.transition = "all 0.5s ease";
            toast.style.opacity = "1";
            toast.style.transform = "translateX(0)";
        }, 100);

        // Auto remove
        setTimeout(() => {
            toast.style.opacity = "0";
            toast.style.transform = "translateX(100%)";
            setTimeout(() => toast.remove(), 500);
        }, 3000);
    });
});
</script>
</body>
</html>
