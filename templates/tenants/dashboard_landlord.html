{% extends 'base.html' %}

{% block content %}

<h1 class="text-3xl font-bold mb-6">Landlord Dashboard</h1>

<div class="grid grid-cols-1 md:grid-cols-4 gap-6">

<div class="card">
<h2>Total Tenants</h2>
<p class="number">{{ tenants_count }}</p>
</div>

<div class="card">
<h2>Total Houses</h2>
<p class="number">{{ houses_count }}</p>
</div>

<div class="card">
<h2>Active Contracts</h2>
<p class="number">{{ contracts_count }}</p>
</div>

<div class="card">
<h2>Total Revenue</h2>
<p class="number">{{ revenue }} TZS</p>
</div>

</div>

{% endblock %}
