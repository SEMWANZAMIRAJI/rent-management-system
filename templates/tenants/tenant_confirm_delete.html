{% extends 'base.html' %}
{% block content %}
<div class="flex justify-center mt-10">
    <div class="card p-6 w-full max-w-md text-center">
        <h2 class="text-xl font-bold mb-4">Delete Tenant</h2>
        <p class="mb-6">Are you sure you want to delete <strong>{{ object.full_name }}</strong>?</p>
        <form method="POST">
            {% csrf_token %}
            <div class="flex justify-center space-x-4">
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded">Delete</button>
                <a href="{% url 'tenants:list' %}" class="bg-gray-300 hover:bg-gray-400 text-black py-2 px-4 rounded">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
